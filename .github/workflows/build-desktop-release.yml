name: Build & Release Desktop App (Analog)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            builder_flag: --mac --arm64
            artifact_pattern: "analog-harness/apps/desktop/release-builds/*.{dmg,zip}"
          - os: macos-13
            target: mac-x64
            builder_flag: --mac --x64
            artifact_pattern: "analog-harness/apps/desktop/release-builds/*.{dmg,zip}"
          - os: windows-latest
            target: win-x64
            builder_flag: --win --x64
            artifact_pattern: "analog-harness/apps/desktop/release-builds/*.{exe,zip,blockmap}"

    steps:
      - name: Checkout analog-harness Repository
        uses: actions/checkout@v4
        with:
          path: analog-harness

      - name: Checkout Chat Repository
        uses: actions/checkout@v4
        with:
          repository: analogai-org/chat
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: chat

      - name: Checkout deepthink Repository
        uses: actions/checkout@v4
        with:
          repository: analogai-org/deepthink
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: deepthink
        continue-on-error: true

      - name: Checkout deepact Repository
        uses: actions/checkout@v4
        with:
          repository: analogai-org/deepact
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: deepact
        continue-on-error: true

      - name: Checkout foundation Repository
        uses: actions/checkout@v4
        with:
          repository: analogai-org/foundation
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: foundation
        continue-on-error: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'chat/requirements.txt'

      - name: Set up sccache compiler cache
        uses: mozilla/sccache-action@v0.0.8

      - name: Install Python Dependencies & Cython / PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel Cython pyinstaller
          pip install -r chat/requirements.txt

      - name: Compile Chat Microservice to Machine Code (.pyd / .so) and Bundle
        working-directory: chat
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          sccache --show-stats || true
          python build_cython_binary.py
          sccache --show-stats || true

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.7.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'analog-harness/pnpm-lock.yaml'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: analog-harness/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Harness Dependencies
        working-directory: analog-harness
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build Harness Libraries and Desktop Bundle
        working-directory: analog-harness
        run: |
          pnpm run build:official

      - name: Prepare Analog Embedded Runtime & Packages
        working-directory: analog-harness/apps/desktop
        run: |
          pnpm run prepare:analog

      - name: Package Desktop Installer (DMG / EXE)
        working-directory: analog-harness/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DSH_DESKTOP_APP_ID: 'ai.analog.desktop'
        run: |
          pnpm exec electron-builder --config analog-builder.config.mjs ${{ matrix.builder_flag }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Analog-${{ matrix.target }}
          path: analog-harness/apps/desktop/release-builds/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: |
          ls -R artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.release_tag }}
          name: Release ${{ github.ref_name != '' && github.ref_name || inputs.release_tag }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
