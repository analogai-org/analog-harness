name: Build & Release Desktop App (Analog)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      runner_strategy:
        description: Runner strategy
        type: choice
        options: [github-cloud, self-hosted]
        default: github-cloud
      release_tag:
        description: Matching Chat and Harness v<version> tag
        required: true
      prerelease:
        description: Publish as prerelease
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Desktop (${{ matrix.target }})
    runs-on: ${{ (inputs.runner_strategy || vars.DESKTOP_RUNNER_STRATEGY) == 'self-hosted' && matrix.self_hosted_runner || matrix.cloud_runner }}
    defaults:
      run:
        shell: pwsh
        working-directory: analog-harness
    strategy:
      fail-fast: false
      matrix:
        include:
          - cloud_runner: macos-14
            self_hosted_runner: [self-hosted, macos-arm64]
            target: mac-arm64
            platform: darwin
            arch: arm64
            builder_platform: --mac
            builder_arch: --arm64
            chat_asset: analog-chat-service-mac-arm64.tar.gz
            installer: dmg
          - cloud_runner: windows-latest
            self_hosted_runner: [self-hosted, win-x64]
            target: win-x64
            platform: win32
            arch: x64
            builder_platform: --win
            builder_arch: --x64
            chat_asset: analog-chat-service-win-x64.zip
            installer: exe
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      DSH_DESKTOP_TARGET_PLATFORM: ${{ matrix.platform }}
      DSH_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
      DSH_DESKTOP_APP_ID: ai.analog.desktop
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          path: analog-harness
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/checkout@v4
        with:
          repository: analogai-org/chat
          ref: ${{ inputs.release_tag || github.ref_name }}
          token: ${{ secrets.GH_PAT || secrets.ANALOG_CI_PAT }}
          path: chat
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: analogai-org/foundation
          token: ${{ secrets.GH_PAT || secrets.ANALOG_CI_PAT }}
          path: foundation
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: analogai-org/deepthink
          token: ${{ secrets.GH_PAT || secrets.ANALOG_CI_PAT }}
          path: deepthink
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: analogai-org/deepact
          token: ${{ secrets.GH_PAT || secrets.ANALOG_CI_PAT }}
          path: deepact
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify version and install dependencies
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag and Harness version differ' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build matching Chat backend
        working-directory: chat
        env:
          POETRY_VIRTUALENVS_CREATE: 'false'
        run: |
          python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version']; assert v == os.environ['APP_VERSION'], 'Chat and Harness versions differ'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --upgrade pip setuptools wheel Cython pyinstaller poetry
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m poetry install --no-root --no-interaction
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python build_cython_binary.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build and package Desktop
        env:
          ANALOG_CHAT_TAG: ${{ inputs.release_tag || github.ref_name }}
          BUILDER_PLATFORM: ${{ matrix.builder_platform }}
          BUILDER_ARCH: ${{ matrix.builder_arch }}
          INSTALLER_EXT: ${{ matrix.installer }}
          TARGET: ${{ matrix.target }}
        run: |
          pnpm run build:official
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --dir apps/desktop run prepare:analog
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --dir apps/desktop exec electron-builder --config analog-builder.config.mjs $env:BUILDER_PLATFORM $env:BUILDER_ARCH --publish never
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($ext in @($env:INSTALLER_EXT, 'zip')) {
            $artifact = "apps/desktop/release-builds/Analog-$($env:APP_VERSION)-$($env:TARGET).$ext"
            if (-not (Test-Path $artifact) -or (Get-Item $artifact).Length -eq 0) { throw "Missing artifact: $artifact" }
          }

      - name: Verify packaged backend starts on port 8071
        run: |
          if ($IsWindows) {
            $executable = 'apps/desktop/release-builds/win-unpacked/resources/analog-chat-service/analog-chat-service.exe'
          } else {
            $executable = 'apps/desktop/release-builds/mac-arm64/Analog.app/Contents/Resources/analog-chat-service/analog-chat-service'
          }
          node apps/desktop/scripts/smoke-chat-backend.mjs $executable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Archive verified Chat backend
        working-directory: chat
        env:
          CHAT_ASSET: ${{ matrix.chat_asset }}
        run: |
          if ($IsWindows) {
            Compress-Archive -Path dist/analog-chat-service -DestinationPath $env:CHAT_ASSET
          } else {
            tar -czf $env:CHAT_ASSET -C dist analog-chat-service
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Chat-${{ matrix.target }}
          path: chat/${{ matrix.chat_asset }}
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Analog-${{ matrix.target }}
          path: |
            analog-harness/apps/desktop/release-builds/*.dmg
            analog-harness/apps/desktop/release-builds/*.exe
            analog-harness/apps/desktop/release-builds/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Clean generated packaging files
        if: always()
        run: |
          foreach ($path in @('apps/desktop/.desktop-build', 'apps/desktop/release-builds', 'apps/desktop/prebuilt', '../chat/dist', '../chat/build', '../chat/cython_staging')) {
            if (Test-Path $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          }

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Chat-*
          path: chat-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          repository: analogai-org/chat
          token: ${{ secrets.GH_PAT || secrets.ANALOG_CI_PAT }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Analog Chat Service ${{ inputs.release_tag || github.ref_name }}
          prerelease: ${{ inputs.prerelease || contains(inputs.release_tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            chat-artifacts/**/analog-chat-service-mac-arm64.tar.gz
            chat-artifacts/**/analog-chat-service-win-x64.zip
      - uses: actions/download-artifact@v4
        with:
          pattern: Analog-*
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Analog Desktop ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || contains(inputs.release_tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
