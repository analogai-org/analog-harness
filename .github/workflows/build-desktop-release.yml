name: Build & Release Desktop App (Analog)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'latest'
      prerelease:
        description: 'Publish as Pre-release (for testing before public launch)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            dsh_platform: darwin
            dsh_arch: arm64
            builder_flag: --mac --arm64
            artifact_pattern: "analog-harness/apps/desktop/release-builds/*.dmg"
          - os: windows-latest
            target: win-x64
            dsh_platform: win32
            dsh_arch: x64
            builder_flag: --win --x64
            artifact_pattern: "analog-harness/apps/desktop/release-builds/*.exe"

    steps:
      - name: Checkout analog-harness Repository
        uses: actions/checkout@v4
        with:
          path: analog-harness

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.7.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'analog-harness/pnpm-lock.yaml'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: analog-harness/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Harness Dependencies
        working-directory: analog-harness
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build Harness Libraries and Desktop Bundle
        working-directory: analog-harness
        run: |
          pnpm run build:official

      - name: Fetch Prebuilt Chat Backend & Prepare Embedded Runtime
        working-directory: analog-harness/apps/desktop
        env:
          DSH_DESKTOP_TARGET_PLATFORM: ${{ matrix.dsh_platform }}
          DSH_DESKTOP_TARGET_ARCH: ${{ matrix.dsh_arch }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.ANALOG_CI_PAT || secrets.GITHUB_TOKEN }}
        run: |
          pnpm run prepare:analog

      - name: Cache Electron and electron-builder Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('analog-harness/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Package Desktop Installer (DMG / EXE)
        working-directory: analog-harness/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DSH_DESKTOP_APP_ID: 'ai.analog.desktop'
          DSH_DESKTOP_TARGET_PLATFORM: ${{ matrix.dsh_platform }}
          DSH_DESKTOP_TARGET_ARCH: ${{ matrix.dsh_arch }}
        run: |
          pnpm exec electron-builder --config analog-builder.config.mjs ${{ matrix.builder_flag }}

      - name: Verify ASAR and Packaging Integrity
        working-directory: analog-harness/apps/desktop
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const releaseDir = path.join(process.cwd(), "release-builds");
          console.log("[Verify] Inspecting release output in:", releaseDir);
          if (!fs.existsSync(releaseDir)) {
            console.error("FATAL: release-builds directory does not exist!");
            process.exit(1);
          }
          const files = fs.readdirSync(releaseDir);
          console.log("[Verify] Generated files:", files);

          // Find mac app or win unpacked directory if present
          const macApp = files.find(f => f.endsWith("-mac") || f.endsWith("-arm64") || f.endsWith("-x64"));
          const winUnpacked = path.join(releaseDir, "win-unpacked");

          let asarPath = null;
          if (fs.existsSync(path.join(releaseDir, "mac-arm64", "Analog.app", "Contents", "Resources", "app.asar"))) {
            asarPath = path.join(releaseDir, "mac-arm64", "Analog.app", "Contents", "Resources", "app.asar");
          } else if (fs.existsSync(path.join(releaseDir, "mac", "Analog.app", "Contents", "Resources", "app.asar"))) {
            asarPath = path.join(releaseDir, "mac", "Analog.app", "Contents", "Resources", "app.asar");
          } else if (fs.existsSync(path.join(winUnpacked, "resources", "app.asar"))) {
            asarPath = path.join(winUnpacked, "resources", "app.asar");
          }

          if (asarPath && fs.existsSync(asarPath)) {
            console.log("[Verify] Checking ASAR contents at:", asarPath);
            try {
              const asarList = execSync(`npx @electron/asar list "${asarPath}"`, { encoding: "utf8" });
              if (!asarList.includes("dsh/desktop-runtime.json") && !asarList.includes("desktop-runtime.json")) {
                console.error("FATAL: desktop-runtime.json IS MISSING FROM app.asar!");
                process.exit(1);
              }
              console.log("[Verify] SUCCESS: dsh/desktop-runtime.json found inside app.asar!");
            } catch (err) {
              console.warn("[Verify] Warning running asar list:", err.message);
            }
          }
          '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Analog-${{ matrix.target }}
          path: |
            analog-harness/apps/desktop/release-builds/*.dmg
            analog-harness/apps/desktop/release-builds/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: |
          ls -R artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.release_tag }}
          name: Analog Desktop ${{ github.ref_name != '' && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || true }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
