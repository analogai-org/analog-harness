name: Build & Release Desktop App (Analog)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'latest'
      prerelease:
        description: 'Publish as Pre-release (for testing before public launch)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, macos-arm64]
            target: mac-arm64
            dsh_platform: darwin
            dsh_arch: arm64
            builder_flag: --mac --arm64
            artifact_pattern: "analog-harness/apps/desktop/release-builds/*.dmg"
          - os: windows-latest
            target: win-x64
            dsh_platform: win32
            dsh_arch: x64
            builder_flag: --win --x64
            artifact_pattern: "analog-harness/apps/desktop/release-builds/*.exe"

    steps:
      - name: Checkout analog-harness Repository
        uses: actions/checkout@v4
        with:
          path: analog-harness

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.7.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'analog-harness/pnpm-lock.yaml'

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: analog-harness/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Harness Dependencies
        working-directory: analog-harness
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version from package.json: $VERSION"
          pnpm install --no-frozen-lockfile

      - name: Build Harness Libraries and Desktop Bundle
        working-directory: analog-harness
        run: |
          pnpm run build:official

      - name: Wait for Chat Backend Compilation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.ANALOG_CI_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for active 'chat' microservice compilation workflows on analogai-org/chat..."
          ACTIVE_RUNS=$(gh run list --repo analogai-org/chat --workflow build-backend.yml --status in_progress --json databaseId -q '.[].databaseId' 2>/dev/null || true)
          QUEUED_RUNS=$(gh run list --repo analogai-org/chat --workflow build-backend.yml --status queued --json databaseId -q '.[].databaseId' 2>/dev/null || true)
          WAITING_RUNS=$(gh run list --repo analogai-org/chat --workflow build-backend.yml --status waiting --json databaseId -q '.[].databaseId' 2>/dev/null || true)

          ALL_RUNS=$(echo "$ACTIVE_RUNS $QUEUED_RUNS $WAITING_RUNS" | xargs)
          if [ -n "$ALL_RUNS" ]; then
            for RUN_ID in $ALL_RUNS; do
              if [ -n "$RUN_ID" ]; then
                echo "Found active chat build (Run ID: $RUN_ID). Pausing desktop build until chat compilation finishes..."
                gh run watch "$RUN_ID" --repo analogai-org/chat --exit-status || true
              fi
            done
            echo "All active chat builds completed! Proceeding to fetch new binaries."
          else
            echo "No active chat builds detected. Proceeding to fetch backend."
          fi

      - name: Fetch Prebuilt Chat Backend & Prepare Embedded Runtime
        working-directory: analog-harness/apps/desktop
        env:
          DSH_DESKTOP_TARGET_PLATFORM: ${{ matrix.dsh_platform }}
          DSH_DESKTOP_TARGET_ARCH: ${{ matrix.dsh_arch }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.ANALOG_CI_PAT || secrets.GITHUB_TOKEN }}
        run: |
          pnpm run prepare:analog

      - name: Cache Electron and electron-builder Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('analog-harness/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Package Desktop Installer (DMG / EXE)
        working-directory: analog-harness/apps/desktop
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DSH_DESKTOP_APP_ID: 'ai.analog.desktop'
          DSH_DESKTOP_TARGET_PLATFORM: ${{ matrix.dsh_platform }}
          DSH_DESKTOP_TARGET_ARCH: ${{ matrix.dsh_arch }}
        run: |
          pnpm exec electron-builder --config analog-builder.config.mjs ${{ matrix.builder_flag }}

      - name: Verify ASAR and Packaging Integrity
        working-directory: analog-harness/apps/desktop
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const releaseDir = path.join(process.cwd(), "release-builds");
          console.log("[Verify] Inspecting release output in:", releaseDir);
          if (!fs.existsSync(releaseDir)) {
            console.error("FATAL: release-builds directory does not exist!");
            process.exit(1);
          }
          const files = fs.readdirSync(releaseDir);
          console.log("[Verify] Generated files:", files);

          // Find mac app or win unpacked directory if present
          const macApp = files.find(f => f.endsWith("-mac") || f.endsWith("-arm64") || f.endsWith("-x64"));
          const winUnpacked = path.join(releaseDir, "win-unpacked");

          let asarPath = null;
          if (fs.existsSync(path.join(releaseDir, "mac-arm64", "Analog.app", "Contents", "Resources", "app.asar"))) {
            asarPath = path.join(releaseDir, "mac-arm64", "Analog.app", "Contents", "Resources", "app.asar");
          } else if (fs.existsSync(path.join(releaseDir, "mac", "Analog.app", "Contents", "Resources", "app.asar"))) {
            asarPath = path.join(releaseDir, "mac", "Analog.app", "Contents", "Resources", "app.asar");
          } else if (fs.existsSync(path.join(winUnpacked, "resources", "app.asar"))) {
            asarPath = path.join(winUnpacked, "resources", "app.asar");
          }

          if (asarPath && fs.existsSync(asarPath)) {
            console.log("[Verify] Checking ASAR contents at:", asarPath);
            try {
              const asarList = execSync(`npx @electron/asar list "${asarPath}"`, { encoding: "utf8" });
              if (!asarList.includes("dsh/desktop-runtime.json") && !asarList.includes("desktop-runtime.json")) {
                console.error("FATAL: desktop-runtime.json IS MISSING FROM app.asar!");
                process.exit(1);
              }
              console.log("[Verify] SUCCESS: dsh/desktop-runtime.json found inside app.asar!");
            } catch (err) {
              console.warn("[Verify] Warning running asar list:", err.message);
            }
          }
          '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Analog-${{ matrix.target }}
          path: |
            analog-harness/apps/desktop/release-builds/*.dmg
            analog-harness/apps/desktop/release-builds/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: [self-hosted, macos-arm64]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout analog-harness Repository
        uses: actions/checkout@v4
        with:
          path: analog-harness

      - name: Determine Release Tag and Name
        id: release_meta
        working-directory: analog-harness
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ inputs.release_tag }}" != "" ] && [ "${{ inputs.release_tag }}" != "latest" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${PKG_VERSION}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=Analog Desktop ${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG}"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: |
          ls -R artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
